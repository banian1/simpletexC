name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release'
        required: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies (incl. PyInstaller)
        run: uv sync --dev

      - name: Install NSIS
        run: choco install nsis -y

      - name: Clean previous build artifacts
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          echo "Cleaned dist/ and build/"

      - name: Build with flet pack
        run: |
          uv run flet pack src/main.py `
            -n simpletexC `
            -v `
            --yes

      - name: List dist contents
        run: Get-ChildItem -Recurse dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simpletexc-windows
          path: dist/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
